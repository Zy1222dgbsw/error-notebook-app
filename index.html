<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能错题本 - Smart Error Notebook</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4F46E5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="错题本">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Tesseract.js: 优先使用国内CDN，失败后用备用CDN -->
  <script>
    (function() {
      var CDNS = [
        'https://registry.npmmirror.com/tesseract.js/5.1.1/files/dist/tesseract.min.js',
        'https://unpkg.com/tesseract.js@5/dist/tesseract.min.js',
        'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'
      ];
      var idx = 0;
      function tryLoad() {
        if (idx >= CDNS.length) return;
        var s = document.createElement('script');
        s.src = CDNS[idx];
        s.onload = function() { console.log('Tesseract.js loaded from CDN #' + (idx + 1)); };
        s.onerror = function() { idx++; tryLoad(); };
        document.head.appendChild(s);
      }
      // 8 秒后如果还没加载成功，标记为不可用
      setTimeout(function() {
        if (typeof Tesseract === 'undefined') {
          console.warn('Tesseract.js CDN 全部加载失败，OCR 功能不可用');
          window.TESSERACT_UNAVAILABLE = true;
        }
      }, 8000);
      tryLoad();
    })();
  </script>
</head>
<body>
  <div class="app-container">
    <!-- 顶部导航 -->
    <header class="app-header">
      <div class="header-left">
        <span class="logo">📓</span>
        <h1>智能错题本</h1>
      </div>
      <div class="header-actions">
        <button class="btn-icon" id="btnTheme" title="切换深色/浅色模式">🌙</button>
        <button class="btn-icon" id="btnSettings" title="设置">⚙️</button>
      </div>
    </header>

    <!-- 标签切换 -->
    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="scan">📸 拍照录入</button>
      <button class="tab-btn" data-tab="notebook">📋 错题本</button>
      <button class="tab-btn" data-tab="subjects">📚 学科管理</button>
    </nav>

    <!-- 主内容区 -->
    <main class="main-content">

      <!-- ===== Tab 1: 拍照录入 ===== -->
      <section class="tab-panel active" id="panel-scan">
        <div class="card">
          <h2>拍摄或上传错题照片</h2>
          <p class="subtitle">支持拍照或从相册选择图片，自动识别题目文字</p>
          
          <div class="upload-area" id="uploadArea">
            <div class="upload-placeholder" id="uploadPlaceholder">
              <span class="upload-icon">📷</span>
              <p>点击下方按钮拍照或选择图片</p>
              <p class="upload-hint">也支持拖拽图片到此处</p>
            </div>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
            <input type="file" id="fileInput" accept="image/*" hidden>
            <video id="cameraPreview" autoplay playsinline hidden></video>
            <canvas id="cameraCanvas" hidden></canvas>
            <img id="imagePreview" alt="预览" hidden>
          </div>

          <div class="upload-actions">
            <button class="btn btn-camera" id="btnTakePhoto">
              <span class="btn-icon-inline">📷</span>
              <span class="btn-label">
                <strong>拍照</strong>
                <small>使用摄像头</small>
              </span>
            </button>
            <button class="btn btn-gallery" id="btnPickFile">
              <span class="btn-icon-inline">🖼️</span>
              <span class="btn-label">
                <strong>相册</strong>
                <small>从本地选择</small>
              </span>
            </button>
            <button class="btn btn-secondary" id="btnRetake" hidden>🔄 重新拍摄</button>
          </div>

          <div id="ocrSection" class="ocr-section" hidden>
            <div class="ocr-header">
              <h3>🔍 文字识别</h3>
              <button class="btn btn-primary btn-sm" id="btnStartOCR">开始识别</button>
            </div>
            <div id="ocrProgress" class="ocr-progress" hidden>
              <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
              </div>
              <p id="progressText">正在识别...</p>
            </div>
            <div class="ocr-result" id="ocrResult" hidden>
              <div class="ocr-result-header">
                <h4>📝 识别结果（可编辑修改）</h4>
                <span class="ocr-edit-badge">点击文字即可编辑 ✏️</span>
              </div>
              <div class="result-text" id="ocrText" contenteditable="true" placeholder="点击此处编辑识别出的文字..."></div>
              <div class="ocr-edit-toolbar">
                <button class="btn btn-sm btn-secondary" id="btnClearText">🗑 清空重输</button>
                <button class="btn btn-sm btn-primary" id="btnConfirmText">✅ 确认内容</button>
              </div>
            </div>
          </div>

          <div id="saveSection" class="save-section" hidden>
            <div class="form-row">
              <div class="form-group">
                <label>学科分类：</label>
                <select id="subjectSelect">
                  <option value="">-- 选择学科 --</option>
                </select>
              </div>
              <div class="form-group">
                <label>题目类型：</label>
                <select id="questionTypeSelect">
                  <option value="">-- 选择题型 --</option>
                </select>
              </div>
            </div>
            <button class="btn btn-success" id="btnSaveError">💾 保存错题</button>
          </div>
        </div>
      </section>

      <!-- ===== Tab 2: 错题本 ===== -->
      <section class="tab-panel" id="panel-notebook">
        <div class="card">
          <div class="notebook-header">
            <h2>我的错题本</h2>
            <div class="filter-bar">
              <select id="filterSubject" class="filter-select">
                <option value="all">全部学科</option>
              </select>
              <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜索错题...">
              <button class="btn btn-sm btn-secondary" id="btnSelectAll">全选</button>
              <button class="btn btn-sm btn-primary" id="btnPrintSelected">🖨️ 打印选中</button>
            </div>
          </div>
          <div id="errorList" class="error-list">
            <div class="empty-state">
              <span class="empty-icon">📝</span>
              <p>还没有错题记录</p>
              <p class="hint">去「拍照录入」添加你的第一道错题吧！</p>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== Tab 3: 学科管理 ===== -->
      <section class="tab-panel" id="panel-subjects">
        <div class="card">
          <h2>学科管理</h2>
          <p class="subtitle">创建学科分类，让错题整理更有序</p>
          
          <div class="add-subject-form">
            <div class="subject-form-row">
              <input type="text" id="newSubjectName" class="form-input" placeholder="学科名称，如：高等数学">
              <input type="color" id="newSubjectColor" value="#4F46E5" class="color-picker" title="选择颜色">
            </div>
            <input type="text" id="newSubjectTypes" class="form-input" placeholder="题型（用逗号分隔），如：选择,填空,解答,计算">
            <button class="btn btn-primary" id="btnAddSubject">➕ 添加学科</button>
          </div>

          <div id="subjectList" class="subject-list">
            <div class="empty-state">
              <span class="empty-icon">📚</span>
              <p>还没有学科分类</p>
              <p class="hint">在上面创建一个学科开始使用吧！</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- AI 解答弹窗 -->
    <div class="modal-overlay" id="modalOverlay" hidden>
      <div class="modal">
        <div class="modal-header">
          <h3>🤖 AI 智能解答</h3>
          <button class="btn-icon modal-close" id="btnCloseModal">✕</button>
        </div>
        <div class="modal-body">
          <div class="question-display">
            <h4>📝 题目：</h4>
            <p id="modalQuestion"></p>
          </div>
          <div class="answer-section" id="answerSection">
            <div id="answerLoading" hidden>
              <div class="loading-spinner"></div>
              <p>AI 正在思考...</p>
            </div>
            <div id="answerContent" class="answer-content" hidden></div>
            <div id="answerError" class="answer-error" hidden>
              <p>😔 AI解答暂时不可用</p>
              <p class="hint">请检查网络连接或在设置中配置API密钥</p>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="btnCloseModal2">关闭</button>
        </div>
      </div>
    </div>

    <!-- 设置弹窗 -->
    <div class="modal-overlay" id="settingsOverlay" hidden>
      <div class="modal modal-settings">
        <div class="modal-header">
          <h3>⚙️ 设置</h3>
          <button class="btn-icon modal-close" id="btnCloseSettings">✕</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>AI 服务提供商：</label>
            <select id="aiProvider" class="form-select">
              <option value="pollinations">Pollinations AI（免费，无需密钥）</option>
              <option value="deepseek">DeepSeek（需API密钥，中文效果好）</option>
              <option value="custom">自定义接口</option>
            </select>
          </div>
          <div class="form-group" id="apiKeyGroup" hidden>
            <label>API 密钥：</label>
            <input type="password" id="apiKey" class="form-input" placeholder="输入你的 API Key">
          </div>
          <div class="form-group" id="customEndpointGroup" hidden>
            <label>自定义接口地址：</label>
            <input type="text" id="customEndpoint" class="form-input" placeholder="https://your-api.com/v1/chat">
          </div>
          <button class="btn btn-primary" id="btnSaveSettings">💾 保存设置</button>
        </div>
      </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast-container" id="toastContainer"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
